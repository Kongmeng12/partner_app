name: partner_app
description: "PhaPhak — ແອັບສຳລັບເຈົ້າຂອງທີ່ພັກ (Partner)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.4
  csv: ^6.0.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Bundled rather than fetched at runtime: Lao glyph coverage in the system
  # font is not guaranteed on every Android build, and a partner opening the app
  # on a bad connection must still be able to read it.
  fonts:
    - family: NotoSansLao
      fonts:
        - asset: assets/fonts/NotoSansLao-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansLao-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansLao-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansLao-Bold.ttf
          weight: 700
